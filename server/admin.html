<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Epochly Admin — Emulation Server</title>
    <link rel="stylesheet" href="/admin.css" />
  </head>
  <body>
    <div class="admin">
      <header>
        <h1>Epochly Emulation Server</h1>
        <p>
          Choose which hardcoded preset <code>POST /time</code> returns. This stands in for the real
          service, which will be backed by
          <a href="https://github.com/libical/libical" target="_blank" rel="noreferrer">libical</a>.
        </p>
      </header>

      <section id="status" class="status"></section>

      <section>
        <h2>Presets</h2>
        <ul id="preset-list" class="preset-list"></ul>
      </section>

      <section>
        <h2>Current response preview</h2>
        <pre id="preview" class="preview">Loading…</pre>
      </section>
    </div>

    <script src="/admin.js"></script>
  </body>
</html>
